# Mosquitto 2.x para pruebas en la red del laboratorio.
# Desde la versión 2.0, sin "listener" el broker solo acepta conexiones locales.
# Uso:  mosquitto -c mosquitto_laboratorio.conf -v

listener 1883 0.0.0.0

# Solo para la red aislada del laboratorio. En producción use usuarios
# (password_file) y TLS en el puerto 8883.
allow_anonymous true
